<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mem0 × HaluMem 정성분석</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <span class="brand">mem0×HaluMem</span>
  <select id="sel-run" title="런 (백본×프롬프트 실험)"></select>
  <select id="sel-judge" title="judge 라벨 세트"></select>
  <select id="sel-user" title="분석 대상 유저"></select>
  <nav id="tabs">
    <button data-tab="sessions" class="active">Sessions</button>
    <button data-tab="qa">QA</button>
    <button data-tab="compare">Compare</button>
    <button data-tab="digest">Digest</button>
  </nav>
  <span id="who" title="클릭해서 이름 변경"></span>
</header>

<main id="layout">
  <aside id="sidebar"></aside>
  <section id="content"></section>
  <aside id="inspector">
    <div id="insp-tabs">
      <button data-itab="detail" class="active">상세</button>
      <button data-itab="trace">Trace</button>
      <button data-itab="comments">코멘트 <span id="cmt-count"></span></button>
    </div>
    <div id="insp-body"></div>
  </aside>
</main>

<div id="modal" class="hidden">
  <div class="modal-box">
    <h3>분석가 이름</h3>
    <p>코멘트에 표시될 이름을 입력해주세요 (최초 1회).</p>
    <input id="name-input" placeholder="예: 원진">
    <button id="name-save">저장</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
