<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에이전트 메모리 벤치마크</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <span class="brand">에이전트 메모리</span>

  <!-- 메모리 시스템 선택은 각 벤치마크 탭 안으로 옮겼다. 탭마다 비교 대상이 다르고
       n개를 동시에 견줘야 하는데, 상단 드롭다운은 하나씩만 고르게 해 화면을 통째로
       갈아끼웠다. 같은 벤치마크 안에서 시스템끼리 비교하는 일이 더 잦다. -->
  <div class="grp"><label data-desc="전 실험 공통 고정 변인. 모든 런이 같은 값이라 드롭다운을 없애고 읽기 전용으로 줄였다. 모델을 갈아끼우며 보던 화면은 정성분석 탭에 그대로 남아 있다">고정 변인</label><div class="ctl"><span id="fixed-vars" class="fixed"></span></div></div>

  <!-- ↓ 정성분석 탭에서만 보이는 옛 컨트롤. 기능은 그대로 살려둔다 -->
  <span id="qual-ctls" class="hidden">
    <div class="grp"><label data-desc="분석 대상 가상 유저: HaluMem 데이터셋의 인물. ★ = nano judge 라벨 보유 (첫 4유저). ★ 없는 유저는 nano 선택 시 라벨이 회색(–)으로 뜸">User</label><div class="ctl"><select id="sel-user"></select></div></div>
    <div class="grp"><label data-desc="A′ 답변 생성(generator) 레인: 답변과 QA 라벨이 이 레인 기준으로 바뀜 (메모리 지표는 Stage A 산출물이라 불변). Judge 목록은 이 선택에 종속">Generator</label><div class="ctl"><select id="sel-generator"></select></div></div>
    <div class="grp"><label data-desc="채점 라벨 세트: 왼쪽에서 선택한 Generator 레인에 존재하는 judge만 표시됨">Judge LLM</label><div class="ctl"><select id="sel-judge"></select></div></div>
    <div class="grp grp-a"><label data-desc="기준(A) 세팅: memory agent 백본(fact 추출·ADD/UPDATE/DELETE 결정 LLM)과 fact 추출 프롬프트">Agent A · Model, Prompt</label><div class="ctl"><select id="sel-backbone"></select><select id="sel-prompt"></select></div></div>
    <div class="grp grp-bcol"><label data-desc="비교(B) 세팅: 같은 유저를 다른 백본·프롬프트로 나란히 관찰">Agent B · Model, Prompt</label><div class="ctl">
      <button id="btn-addb" data-desc="비교(B) 세팅을 열어 같은 유저를 두 세팅에서 나란히 관찰">+ 비교(B)</button>
      <span id="grp-b" class="hidden"><select id="sel-backbone-b"></select><select id="sel-prompt-b"></select><button id="btn-delb" data-desc="비교 세팅 닫기">×</button></span>
    </div></div>
    <span id="emb-name" class="hidden"></span>
  </span>

  <nav id="tabs">
    <button data-tab="overview" class="active" data-desc="세 벤치마크를 메모리 시스템별로 한 화면에. 어느 벤치마크가 무엇을 묻는지에 따라 부호가 갈리는 것이 이 표의 요지임">개요</button>
    <button data-tab="halumem" data-desc="HaluMem (arXiv 2025). 골든 메모리가 있어 저장·정확도·갱신을 직접 잼. 메모리 시스템별로 나란히 봄">HaluMem</button>
    <button data-tab="beam" data-desc="BEAM 벤치마크 (ICLR 2026). 능력 10종 x 검색 예산(cutoff) 4개. 골든 메모리가 없어 QA 하나만 재는 대신 문항마다 어떤 능력을 묻는지가 라벨로 붙어 있음">BEAM</button>
    <button data-tab="memora" data-desc="Memora 벤치마크 (ACL 2026 Findings). 삭제까지 재는 첫 벤치마크임. 문항마다 &#39;넣어야 할 것&#39;과 &#39;빼야 할 것&#39; 두 종류 기준이 붙고 FAMA 로 합쳐짐">Memora</button>
    <button data-tab="cost" data-desc="배포 관점의 비용 축: 호출 수·입출력 토큰·컨텍스트 크기. 정확도만 놓고 방법을 고르면 실제로 못 쓴다. 계측은 실제로 선을 타고 나간 호출을 센 것임">비용</button>
    <button data-tab="synthesis" data-desc="3 벤치마크 × 3 시스템 전체 실험의 심층 판독: 근거 도달률·미끼 영향·갱신 채점의 실체·프롬프트 상호작용·질문 유형 타당성·문제 카드. 수치는 산출물 재분석(추가 인퍼런스 없음)">판독</button>
    <button data-tab="qual" data-desc="세션 단위 탐색·QA 실패 훑기·A/B 대조·백본 그리드·코멘트. 모델을 갈아끼우며 보던 옛 화면을 그대로 보존한 곳임. Trace 도 여기서 봄">정성분석</button>
  </nav>
  <span id="who" data-desc="클릭해서 이름 변경"></span>
</header>

<main id="layout">
  <aside id="sidebar"></aside>
  <div class="rz" id="rz1" title="드래그로 너비 조절"></div>
  <section id="content-wrap">
    <div id="qualnav" class="subnav hidden"></div>
    <section id="content"></section>
  </section>
  <div class="rz" id="rz2" title="드래그로 너비 조절"></div>
  <aside id="inspector">
    <div id="insp-tabs">
      <button data-itab="detail" class="active">상세</button>
      <button data-itab="trace">Trace</button>
      <button data-itab="comments">코멘트 <span id="cmt-count"></span></button>
    </div>
    <div id="insp-body"></div>
  </aside>
</main>

<div id="modal" class="hidden">
  <div class="modal-box">
    <h3>분석가 이름</h3>
    <p>코멘트에 표시될 이름을 입력해주세요 (최초 1회).</p>
    <input id="name-input" placeholder="예: 원진">
    <button id="name-save">저장</button>
  </div>
</div>

<div id="jmodal" class="hidden">
  <div class="jbox">
    <div id="jmodal-head"></div>
    <div id="jmodal-body"></div>
  </div>
</div>

<div id="loading" class="hidden"><div class="spinner"></div><span id="loading-msg">불러오는 중…</span></div>
<button id="sel-cmt" class="hidden">💬 코멘트</button>
<button id="btn-reload" data-desc="서버·브라우저 캐시를 모두 비우고 현재 화면을 다시 로드: 라벨이 회색(–)으로 남는 등 이상할 때">↻ 강제 재로딩</button>
<div id="tip" class="hidden"></div>

<script src="/static/app.js"></script>
</body>
</html>
