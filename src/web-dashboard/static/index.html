<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mem0 × HaluMem 정성분석</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <span class="brand">mem0×HaluMem</span>
  <div class="grp"><label data-desc="분석 대상 가상 유저: HaluMem 데이터셋의 인물. ★ = nano judge 라벨 보유 (첫 4유저). ★ 없는 유저는 nano 선택 시 라벨이 회색(–)으로 뜸">User</label><div class="ctl"><select id="sel-user"></select></div></div>
  <div class="grp"><label data-desc="A′ 답변 생성(generator) 레인: 답변과 QA 라벨이 이 레인 기준으로 바뀜 (메모리 지표는 Stage A 산출물이라 불변). Judge 목록은 이 선택에 종속">Generator</label><div class="ctl"><select id="sel-generator"></select></div></div>
  <div class="grp"><label data-desc="채점 라벨 세트: 왼쪽에서 선택한 Generator 레인에 존재하는 judge만 표시됨">Judge LLM</label><div class="ctl"><select id="sel-judge"></select></div></div>
  <div class="grp"><label data-desc="벡터 검색 임베더: 전 실험 공통 고정 (통제 변인)">Embedding</label><div class="ctl"><span id="emb-name" class="fixed"></span></div></div>
  <div class="grp grp-a"><label data-desc="기준(A) 세팅: memory agent 백본(fact 추출·ADD/UPDATE/DELETE 결정 LLM)과 fact 추출 프롬프트(default=mem0 기본 / custom=HaluMem 원본 지침)">Agent A · Model, Prompt</label><div class="ctl"><select id="sel-backbone"></select><select id="sel-prompt"></select></div></div>
  <div class="grp grp-bcol"><label data-desc="비교(B) 세팅: 같은 유저를 다른 백본·프롬프트로 나란히 관찰">Agent B · Model, Prompt</label><div class="ctl">
    <button id="btn-addb" data-desc="비교(B) 세팅을 열어 같은 유저를 두 세팅에서 나란히 관찰">+ 비교(B)</button>
    <span id="grp-b" class="hidden"><select id="sel-backbone-b"></select><select id="sel-prompt-b"></select><button id="btn-delb" data-desc="비교 세팅 닫기">×</button></span>
  </div></div>
  <nav id="tabs">
    <button data-tab="sessions" class="active" data-desc="세션 단위 탐색: QA·대화·골든/추출 대조">Sessions</button>
    <button data-tab="qa" data-desc="전체 QA를 판정(C/H/O)별로 필터링해 실패 사례부터 훑기">QA</button>
    <button data-tab="compare" data-desc="A/B 세팅의 유저 전체 요약·QA 판정 대조표">Compare</button>
    <button data-tab="metrics" data-desc="전체 실험(백본×프롬프트)의 HaluMem Table 3 지표 테이블: 공식 집계 함수로 실시간 산출">Metrics</button>
    <button data-tab="digest" data-desc="이 유저에 대한 모든 분석가의 코멘트 모아보기 + export">Digest</button>
  </nav>
  <span id="who" data-desc="클릭해서 이름 변경"></span>
</header>

<main id="layout">
  <aside id="sidebar"></aside>
  <div class="rz" id="rz1" title="드래그로 너비 조절"></div>
  <section id="content"></section>
  <div class="rz" id="rz2" title="드래그로 너비 조절"></div>
  <aside id="inspector">
    <div id="insp-tabs">
      <button data-itab="detail" class="active">상세</button>
      <button data-itab="trace">Trace</button>
      <button data-itab="comments">코멘트 <span id="cmt-count"></span></button>
    </div>
    <div id="insp-body"></div>
  </aside>
</main>

<div id="modal" class="hidden">
  <div class="modal-box">
    <h3>분석가 이름</h3>
    <p>코멘트에 표시될 이름을 입력해주세요 (최초 1회).</p>
    <input id="name-input" placeholder="예: 원진">
    <button id="name-save">저장</button>
  </div>
</div>

<div id="jmodal" class="hidden">
  <div class="jbox">
    <div id="jmodal-head"></div>
    <div id="jmodal-body"></div>
  </div>
</div>

<div id="loading" class="hidden"><div class="spinner"></div><span id="loading-msg">불러오는 중…</span></div>
<button id="sel-cmt" class="hidden">💬 코멘트</button>
<button id="btn-reload" data-desc="서버·브라우저 캐시를 모두 비우고 현재 화면을 다시 로드: 라벨이 회색(–)으로 남는 등 이상할 때">↻ 강제 재로딩</button>
<div id="tip" class="hidden"></div>

<script src="/static/app.js"></script>
</body>
</html>
