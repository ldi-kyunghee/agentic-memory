# 필드 사전 — UI 툴팁/설명 패널의 단일 출처. key는 JSON 필드명 그대로.
memory_points: "이 세션의 골든 메모리 포인트(정답지). 시스템이 추출했어야 하는 정보의 목록 — HaluMem 데이터셋 제공"
memory_content: "메모리의 텍스트 내용"
memory_type: "골든 메모리의 유형 (Event / Persona / Relationship Memory)"
is_update: "True면 이 골든은 과거 세션 정보의 갱신본 — update 평가(C/H/O) 대상"
original_memories: "is_update 골든의 갱신 전 옛 버전(들). update 판정 시 judge에게 함께 제공됨"
importance: "골든의 중요도 가중치 (0~1). Weighted Recall 계산에 사용"
memory_source: "골든의 출처 태그. system=프로필성, secondary=대화 유래, interference=의도적 미끼(AI 발화에만 있고 user가 확정 안 한 내용 — FMR 평가용, R/WR 모수에서 제외)"
event_source: "골든이 유래한 대화 턴 번호 — ⚠ system 골든에만 존재하고 정합도 낮아 참고용"
extracted_memories: "시스템(mem0)이 이 세션에서 최종 보유하게 된 후보 메모리 스냅샷 (신규 추출 ADD + 갱신 재작성본 UPDATE 포함, DELETE 제외)"
memory_events: "이 세션에서 mem0가 실행한 메모리 연산 로그. event=ADD/UPDATE/DELETE, UPDATE면 previous_memory에 갱신 전 텍스트"
memories_from_system: "update 평가용 스냅샷: is_update 골든에 대해 시스템 메모리를 top-10 검색한 결과 (Stage A 시점)"
questions: "이 세션에 딸린 QA 평가 문항들"
question_type: "질문 유형 (Basic Fact Recall / Multi-hop / Dynamic Update / Memory Boundary / Memory Conflict / Generalization)"
evidence: "이 질문의 근거가 되는 골든 메모리 포인트들"
context: "답변 생성 시 시스템 메모리에서 top-20 검색으로 가져온 컨텍스트 (Stage A에서 저장)"
system_response: "Stage A'에서 generator가 context를 보고 생성한 답변 — 어떤 generator인지는 상단 Generator 선택(카드 제목의 gen=)을 따름"
memory_integrity_score: "judge의 포함 판정 (골든 1건 vs 추출 전체): 2=원자 정보 전부 포함, 1=부분 포함, 0=미포함/오류. R=2점 비율, WR=가중 평균"
memory_accuracy_score: "judge의 근거 판정 (후보 1건 vs 당해 세션 대화+골든): 2=전부 근거 있음, 1=일부 비지지, 0=비지지/모순. ⚠ 교차 세션 누적 내용을 담은 UPDATE 재작성본은 구조적으로 불리할 수 있음"
is_included_in_golden_memories: "후보의 원자 정보들이 골든에 존재하는 필드(주제)에 대응하는지 — true면 Target P 모수에 포함"
memory_update_type: "update 판정: Correct=갱신본의 모든 원자 정보·수치 정확, Hallucination=틀린 값 생성, Omission=디테일 누락"
result_type: "QA 판정: Correct / Hallucination(날조) / Omission(누락·회피)"
add_dialogue_duration_ms: "이 세션 투입(mem0.add)에 걸린 시간"
search_duration_ms: "이 질문의 top-20 검색에 걸린 시간"
dialogue_turn: "세션 내 대화 턴 인덱스"
index: "골든 메모리의 세션 내 번호 (데이터셋 제공)"
question: "QA 평가 문항의 질문 텍스트"
dialogue: "세션 대화 원문 (턴 배열)"
response_duration_ms: "A′ 답변 생성에 걸린 시간"
timestamp: "이 항목의 가상 시각"
