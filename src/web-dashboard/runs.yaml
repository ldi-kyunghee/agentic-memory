# 런 레지스트리 — 새 실험 추가 시 이 파일에만 항목 추가 (경로는 리포 루트 기준)
# judges: 라벨 세트 이름 -> judge 디렉토리 (유저별 {uuid}.json). 초기 런들의 불규칙 네이밍은 여기서 흡수함.
# A' 답변 생성(generator) 레인 — 레인마다 results(jsonl)와 judge 세트가 다름.
# base: true 인 레인은 각 런의 기본 results/judges를 그대로 사용. 그 외에는 {run} 템플릿 경로.
generators:
  qwen4b:
    label: "Qwen3-4B"
    base: true
  mini:
    label: "GPT-5-Mini (minimal · 1유저)"
    results: "results/mem0-classic-oss/genmini/{run}.jsonl"
    judges:
      mini-genmini: "results/mem0-classic-oss/judge-mini-genmini-{run}/judge"
  oss120:
    label: "gpt-oss-120b (high · 1유저)"
    results: "results/mem0-classic-oss/genoss120/{run}.jsonl"
    judges:
      oss120-genoss120: "results/mem0-classic-oss/judge-oss120-genoss120-{run}/judge"
      # 동일 입력·동일 judge 반복 채점 (자기 일관성 측정용, oss120b4에만 존재)
      oss120-rep1: "results/mem0-classic-oss/judge-rep1-{run}/judge"
      oss120-rep2: "results/mem0-classic-oss/judge-rep2-{run}/judge"
      oss120-rep3: "results/mem0-classic-oss/judge-rep3-{run}/judge"
  # 오라클 상한 레인: 검색 결과 대신 '정답 근거 골든(evidence)'만 주고 답변시킨 결과.
  # 저장·검색이 완벽했을 때의 QA 상한 — generator 병목 여부 판별용 (full-traced에만 존재)
  oracle:
    label: "오라클 (정답 근거만 · QA 상한)"
    results: "results/mem0-classic-oss/genoracle/{run}.jsonl"
    judges:
      oracle-oss120: "results/mem0-classic-oss/judge-oracle-{run}/judge"
  # 오라클 + 잡음 유지 레인: 정답 근거를 포함하되 실제 검색 결과로 top-20까지 채운 컨텍스트
  oraclepad:
    label: "오라클+잡음 (top-20 유지)"
    results: "results/mem0-classic-oss/genoraclepad/{run}.jsonl"
    judges:
      oraclepad-oss120: "results/mem0-classic-oss/judge-oraclepad-{run}/judge"
  # 1u 레인의 4유저 확장본. 1u 레인은 정성분석가들의 작업·코멘트 스코프 보존을 위해 그대로 둠
  oss120-4u:
    label: "gpt-oss-120b (high · 4유저)"
    results: "results/mem0-classic-oss/genoss120-4u/{run}.jsonl"
    judges:
      oss120-genoss120-4u: "results/mem0-classic-oss/judge-oss120-genoss120-4u-{run}/judge"

# 고정 레인 행 — Metrics 표(HaluMem Table 3)에 상단바 generator·judge 선택과 무관하게 항상 이 조합으로 집계해
# 붙이는 행. 검색 오라클처럼 '답변 생성 레인 자체가 실험 조건'인 세팅은 일반 런으로는 표현할 수 없다.
# oracle 값에 따라 읽을 수 없게 된 지표 칼럼은 화면에서 자동으로 '–' 처리된다 (app.py의 ORACLE_MASK).
extra_rows:
  - key: "oe2:oraclepad"
    run: oe2
    generator: oraclepad
    judge: oraclepad-oss120
    repeat_judge: "results/mem0-classic-oss/judge-oraclepad-4u-r{i}-{run}/judge"
    label: "오라클 ③ 추출+갱신+검색 · 잡음 유지 (4u)"
    backbone: gpt-oss-120b
    backbone_effort: "해당 없음 — 추출·갱신 오라클, 답변은 정답 근거+실제 검색 잡음으로 top-20 구성"
    prompt: default
    oracle: extraction+update+retrieval
    note: "정답 근거를 반드시 포함시키되 나머지는 실제 검색 결과로 채워 컨텍스트 규모를 top-20으로 맞춘 대조군. E2와의 차이가 '순수 검색 정확도'인데 5회 반복 결과 -1.71p (p=0.26, 유의하지 않음) — 오라클 저장소에서는 top-20이 이미 정답 근거를 잡아온다"
  - key: "full-traced:oracle"
    run: oss120b4
    generator: oracle
    judge: oracle-oss120
    repeat_judge: "results/mem0-classic-oss/judge-oracle-4u-r{i}-{run}/judge"
    label: "오라클 ④ 추출+갱신+검색 · 근거만 (4u)"
    backbone: gpt-oss-120b
    backbone_effort: "해당 없음 — 메모리 시스템 미사용, 정답 근거(evidence)만 직접 제공"
    prompt: default
    oracle: extraction+update+retrieval
    note: "⚠ 이는 '완벽한 검색'이 아니라 '정답 근거만 남기고 나머지를 전부 제거한' 조건이다 — 평균 1.4개 항목(실제 검색은 top-20). ③과의 +11.10p 차이는 검색 정확도가 아니라 컨텍스트 축약 효과다. ⚠ carrier run이 full-traced(Qwen3-4B 저장소)라 사다리 기준선(oss120b4)과 저장소가 다르다 — 답변이 저장소를 안 거치므로 QA C는 영향받지 않지만, 4유저 확장 때 oss120b4로 옮긴다"

# 단계별 오라클 상한 사다리 — mem0 파이프라인의 각 단계를 차례로 '완벽'하게 만들며 QA 상한을 잰다.
# 아직 안 돌린 단계는 화면에서 '미실행'으로 표시되고, 산출물이 생기면 자동으로 채워진다.
# stages: 그 행에서 오라클로 대체된 단계 (extraction=fact 추출, update=갱신 결정, retrieval=저장·검색)
oracle_ladder:
  # 반복 회차 산출물은 레인으로 등록하지 않고 경로 템플릿으로 직접 읽는다 (드롭다운을 붐비게 하지 않음).
  # 개별 회차를 화면에서 열어보고 싶어지면 generators에 레인으로 추가하면 된다 — 산출물 경로는 동일.
  repeats: 5
  note: "Martin 1유저 · agent=gpt-oss-120b(effort 기본값 medium, 기존 실험과 통제 일치) · gen=judge=gpt-oss-120b(high) 고정. 5회 반복 평균±표본표준편차. 판독: 추출 +11.58(p=0.0001)만 유의하고, 갱신 +1.46(p=0.43)·검색정확도 -1.71(p=0.26)은 노이즈 — 추출 오라클 이후 갱신과 검색을 둘 다 완벽하게 만들어도 얻는 게 없다(E1→E2pad -0.24, p=0.87). 마지막 +11.10은 검색이 아니라 컨텍스트 축약 효과다"
  steps:
    - key: actual
      repeat_judge: "results/mem0-classic-oss/judge-oss120-4u-r{i}-{run}/judge"
      label: "실측 (오라클 없음)"
      stages: []
      run: oss120b4
      generator: oss120-4u
      judge: oss120-genoss120-4u
      desc: "gpt-oss-120b 백본이 실제로 추출·갱신·검색한 결과 — 사다리의 기준선"
    - key: e1
      repeat_judge: "results/mem0-classic-oss/judge-oss120-4u-r{i}-{run}/judge"
      label: "추출 오라클"
      stages: [extraction]
      run: oe1
      generator: oss120-4u
      judge: oss120-genoss120-4u
      desc: "골든 메모리(미끼 제외)를 추출 결과로 주입. 갱신 결정·저장·검색은 실제 로직"
    - key: e2
      repeat_judge: "results/mem0-classic-oss/judge-oss120-4u-r{i}-{run}/judge"
      label: "추출+갱신 오라클"
      stages: [extraction, update]
      run: oe2
      generator: oss120-4u
      judge: oss120-genoss120-4u
      desc: "갱신 결정도 정답대로(is_update면 원본 교체). 남은 변수는 저장소 검색뿐 — 백본 무관"
    - key: e2pad
      repeat_judge: "results/mem0-classic-oss/judge-oraclepad-4u-r{i}-{run}/judge"
      label: "추출+갱신+검색 오라클 (잡음 유지)"
      stages: [extraction, update, retrieval]
      run: oe2
      generator: oraclepad
      judge: oraclepad-oss120
      run_display: "정답 근거 + 실제 검색 잡음으로 top-20"
      desc: "정답 근거를 반드시 포함시키되 나머지는 실제 검색 결과로 채워 컨텍스트 규모를 top-20으로 맞춘 대조군. 이 행과 위 행(E2)의 차이가 '순수 검색 정확도', 아래 행과의 차이가 '컨텍스트 축약·정제'의 기여다"
    - key: retrieval
      repeat_judge: "results/mem0-classic-oss/judge-oracle-4u-r{i}-{run}/judge"
      label: "추출+갱신+검색 오라클 (근거만)"
      stages: [extraction, update, retrieval]
      run: oss120b4
      generator: oracle
      judge: oracle-oss120
      desc: "메모리 시스템을 전혀 쓰지 않고 정답 근거(evidence)만 직접 제공. ⚠ 이는 '완벽한 검색'이 아니라 '정답 근거만 남기고 나머지를 전부 제거한' 조건이다 — 평균 1.4개 항목(실제 검색은 top-20). 검색 정확도와 컨텍스트 축약 효과가 섞여 있어 이 구간의 증가분은 검색의 기여를 과대평가한다"
      run_display: "메모리 시스템 미사용 (evidence 직접 제공)"

runs:
  full-traced:
    label: "Qwen3-4B × default (20u)"
    note: "Qwen 베이스라인 — ⚠ UPDATE 19,752건 중 97%가 내용 무변경(no-op)으로 판명(20유저). '다작·과잉 재작성' 서술은 정정됨: 재작성이 망가진 게 아니라 갱신을 안 해 낡은 메모리가 재등록되며 Acc가 깎임"
    backbone: Qwen3-4B-Instruct-2507
    prompt: default
    embedder: Qwen3-Embedding-4B
    users: 20
    results: results/mem0-classic-oss/memzero-oss-full-traced/memzero-oss_eval_results.jsonl
    traces: traces/mem0-classic-oss/full-traced
    judges:
      qwen4b: results/mem0-classic-oss/memzero-oss-full-traced/judge
      nano: results/mem0-classic-oss/judge-gpt5nano-4u/judge

  full-custom:
    label: "Qwen3-4B × custom (20u)"
    note: "R/F1 급등하나 FMR 급락(지침 무시 오염 커버리지), QA 정체 — 병목이 초장문 활용(생성)으로 이동"
    backbone: Qwen3-4B-Instruct-2507
    prompt: custom
    embedder: Qwen3-Embedding-4B
    users: 20
    results: results/mem0-classic-oss/memzero-oss-full-custom/memzero-oss_eval_results.jsonl
    traces: traces/mem0-classic-oss/full-custom
    judges:
      qwen4b: results/mem0-classic-oss/memzero-oss-full-custom/judge
      nano: results/mem0-classic-oss/judge-gpt5nano-4u-custom/judge

  nano4:
    label: "GPT-5-Nano × default (4u)"
    note: "적지만 깨끗한 저장 — R 최저인데 QA 상위, '청결도>커버리지 총량' 증거"
    backbone: gpt-5-nano
    backbone_effort: "default(medium) — mem0가 effort 미전달"
    prompt: default
    embedder: Qwen3-Embedding-4B
    users: 4
    results: results/mem0-classic-oss/memzero-oss-nano4/memzero-oss_eval_results.jsonl
    traces: traces/mem0-classic-oss/nano4
    judges:
      nano: results/mem0-classic-oss/judge-gpt5nano-4u-nano/judge

  nano4-custom:
    label: "GPT-5-Nano × custom (4u)"
    note: "지침 과잉 준수로 커버리지 부족 — QA 최저 셀"
    backbone: gpt-5-nano
    backbone_effort: "default(medium) — mem0가 effort 미전달"
    prompt: custom
    embedder: Qwen3-Embedding-4B
    users: 4
    results: results/mem0-classic-oss/memzero-oss-nano4-custom/memzero-oss_eval_results.jsonl
    traces: traces/mem0-classic-oss/nano4-custom
    judges:
      nano: results/mem0-classic-oss/judge-gpt5nano-4u-nano-custom/judge

  mini4:
    label: "GPT-5-Mini × default (4u)"
    note: "현 QA 1위(52.91) — 능력 사다리 미포화, Upd C 27.56로 논문 GPT-4o(25.50) 상회"
    backbone: gpt-5-mini
    backbone_effort: "default(medium) — mem0가 effort 미전달"
    prompt: default
    embedder: Qwen3-Embedding-4B
    users: 4
    results: results/mem0-classic-oss/memzero-oss-mini4/memzero-oss_eval_results.jsonl
    traces: traces/mem0-classic-oss/mini4
    judges:
      nano: results/mem0-classic-oss/judge-gpt5nano-4u-mini/judge

  mini4-custom:
    label: "GPT-5-Mini × custom (4u)"
    note: "선별 정밀형 — Acc·Target P 전 셀 최고, 빈 세션 다수로 QA는 default에 밀림"
    backbone: gpt-5-mini
    backbone_effort: "default(medium) — mem0가 effort 미전달"
    prompt: custom
    embedder: Qwen3-Embedding-4B
    users: 4
    results: results/mem0-classic-oss/memzero-oss-mini4-custom/memzero-oss_eval_results.jsonl
    traces: traces/mem0-classic-oss/mini4-custom
    judges:
      nano: results/mem0-classic-oss/judge-gpt5nano-4u-mini-custom/judge

  30b4:
    label: "Qwen3-30B-A3B × default (4u)"
    note: "체급 7.5배에도 4B와 동일한 실패 — ⚠ UPDATE 2,512건 중 96.9%가 no-op(4유저). 스케일로는 UPDATE 이행이 해결되지 않고 reasoning이 갈림(think4 0.6%)"
    backbone: Qwen3-30B-A3B-Instruct-2507
    prompt: default
    embedder: Qwen3-Embedding-4B
    users: 4
    results: results/mem0-classic-oss/memzero-oss-30b4/memzero-oss_eval_results.jsonl
    traces: traces/mem0-classic-oss/30b4
    judges:
      nano: results/mem0-classic-oss/judge-gpt5nano-4u-30b4/judge

  30b4-custom:
    label: "Qwen3-30B-A3B × custom (4u)"
    note: "custom 프롬프트 QA 기준 4백본 전패 패턴 유지"
    backbone: Qwen3-30B-A3B-Instruct-2507
    prompt: custom
    embedder: Qwen3-Embedding-4B
    users: 4
    results: results/mem0-classic-oss/memzero-oss-30b4-custom/memzero-oss_eval_results.jsonl
    traces: traces/mem0-classic-oss/30b4-custom
    judges:
      nano: results/mem0-classic-oss/judge-gpt5nano-4u-30b4-custom/judge

  think4:
    label: "Qwen3-4B-Thinking × default (4u)"
    note: "UPDATE 이행의 분기점 — 같은 4B에 thinking만 얹으니 no-op UPDATE 97%→0.6%로 붕괴(실제 갱신 수행). FMR 최고·R 최저의 초절제형, 청결도로 4B-Instruct QA 상회"
    backbone: Qwen3-4B-Thinking-2507
    backbone_effort: "항상 사고 (effort 개념 없음, vLLM)"
    prompt: default
    embedder: Qwen3-Embedding-4B
    users: 4
    results: results/mem0-classic-oss/memzero-oss-think4/memzero-oss_eval_results.jsonl
    traces: traces/mem0-classic-oss/think4
    judges:
      nano: results/mem0-classic-oss/judge-gpt5nano-4u-think4/judge

  think4-custom:
    label: "Qwen3-4B-Thinking × custom (4u)"
    note: "과잉 절제의 붕괴 — 세션 58%에서 명시적 {facts:[]} 반환(잘림 아님, trace 검증), 그 세션들에 골든 62%가 소재. thinking이 '서사' 지침을 문자 그대로 적용해 사실형 세션을 통째 기각. QA C 34.18 최저 셀"
    backbone: Qwen3-4B-Thinking-2507
    backbone_effort: "항상 사고 (effort 개념 없음, vLLM)"
    prompt: custom
    embedder: Qwen3-Embedding-4B
    users: 4
    results: results/mem0-classic-oss/memzero-oss-think4-custom/memzero-oss_eval_results.jsonl
    traces: traces/mem0-classic-oss/think4-custom
    judges:
      nano: results/mem0-classic-oss/judge-gpt5nano-4u-think4-custom/judge

  oss120b4:
    label: "gpt-oss-120b × default (4u)"
    note: "nano4 동형 프로파일의 로컬 재현(볼륨·R·포함분포 일치) — 실질 우위는 UPDATE-유래 Acc 96.4%(nano4 80.1%)의 재작성 견고성. QA 차이는 1유저 노이즈(155문항 중 순차 1)(oss120 judge·1u 기준)"
    backbone: gpt-oss-120b
    backbone_effort: "default(medium) — effort 주입 패치가 미배포 상태로 실행돼 env 무시됨 (mem0는 effort 미전달)"
    prompt: default
    embedder: Qwen3-Embedding-4B
    users: 4
    results: results/mem0-classic-oss/memzero-oss-oss120b4/memzero-oss_eval_results.jsonl
    traces: traces/mem0-classic-oss/oss120b4
    judges:
      nano: results/mem0-classic-oss/judge-gpt5nano-4u-oss120b4/judge

  oss120b4-custom:
    label: "gpt-oss-120b × custom (4u)"
    note: "custom 전패 패턴 6번째 백본에서도 유지(QA 55.5<58.5) — 문단형 ADD 87%가 부분(1점) 판정. FMR·Upd C는 상승(oss120 judge·1u 기준)"
    backbone: gpt-oss-120b
    backbone_effort: "default(medium) — effort 주입 패치가 미배포 상태로 실행돼 env 무시됨 (mem0는 effort 미전달)"
    prompt: custom
    embedder: Qwen3-Embedding-4B
    users: 4
    results: results/mem0-classic-oss/memzero-oss-oss120b4-custom/memzero-oss_eval_results.jsonl
    traces: traces/mem0-classic-oss/oss120b4-custom
    judges:
      nano: results/mem0-classic-oss/judge-gpt5nano-4u-oss120b4-custom/judge

  # ── 단계별 오라클 사다리 전용 런 (전부 gpt-oss-120b · effort=high · Martin 1유저) ──
  oe1:
